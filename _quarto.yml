project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!templates/"

website:
  title: "Neurotech Pulse"
  description: "Tracking the pulse of applied neurotechnology — AI, decoders, devices, and the data science underneath."
  site-url: https://bkowshik.github.io/neurotech-pulse/
  repo-url: https://github.com/bkowshik/neurotech-pulse

  navbar:
    title: "〰️⚡"
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: daily/index.qmd
        text: Daily
      - href: weekly/index.qmd
        text: Weekly
      - href: monthly/index.qmd
        text: Monthly
      - href: about.qmd
        text: About
    right:
      - icon: rss
        href: index.xml
      - icon: github
        href: https://github.com/bkowshik/neurotech-pulse

  page-footer:
    left: "Neurotech Pulse — curated by [Bhargav Kowshik](https://github.com/bkowshik), authored with Claude Code."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    fig-cap-location: bottom

execute:
  freeze: auto
